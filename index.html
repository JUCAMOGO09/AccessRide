<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F766E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AccessRide Colombia — Transporte accesible</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --bg-primary:#F5F3EE;
  --bg-secondary:#FFFFFF;
  --bg-tertiary:#EDE9E0;
  --bg-elevated:#FFFFFF;
  --text-primary:#1A1F2E;
  --text-secondary:#4A5568;
  --text-muted:#718096;
  --accent-primary:#0F766E;
  --accent-primary-hover:#115E59;
  --accent-secondary:#D97706;
  --accent-secondary-hover:#B45309;
  --accent-success:#059669;
  --accent-danger:#DC2626;
  --accent-danger-hover:#B91C1C;
  --border:#D6D3CD;
  --border-subtle:#E8E4DB;
  --shadow-sm: 0 1px 3px rgba(26,31,46,.06);
  --shadow-md: 0 4px 16px rgba(26,31,46,.10);
  --shadow-lg: 0 12px 40px rgba(26,31,46,.14);
  --shadow-xl: 0 20px 60px rgba(26,31,46,.18);
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:8px;
  --focus: 3px solid #0F766E;
  --focus-offset:2px;
  --font-body: 'Atkinson Hyperlegible', Arial, sans-serif;
  --font-disp: 'Manrope', 'Atkinson Hyperlegible', Arial, sans-serif;
  --ease: cubic-bezier(.2,.7,.3,1);
  --glass: rgba(255,255,255,.72);
  --glass-border: rgba(255,255,255,.35);
}
